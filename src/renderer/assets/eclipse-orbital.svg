<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Eclipse orbital mark</title>
  <desc id="desc">A golden orbital ring surrounding an eclipse crescent.</desc>
  <defs>
    <linearGradient id="ring" x1="14" y1="12" x2="79" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4C9"/>
      <stop offset=".44" stop-color="#EBC76E"/>
      <stop offset="1" stop-color="#92632E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(45 42) rotate(48) scale(48)">
      <stop stop-color="#FFE9A4" stop-opacity=".38"/>
      <stop offset="1" stop-color="#D89D4D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="48" cy="48" r="43" fill="url(#glow)"/>
  <circle cx="48" cy="48" r="31" fill="none" stroke="url(#ring)" stroke-width="3.4"/>
  <ellipse cx="48" cy="48" rx="39" ry="16" fill="none" stroke="url(#ring)" stroke-opacity=".66" stroke-width="2" transform="rotate(-31 48 48)"/>
  <path d="M53 18C35 28 31 54 42 72c5 8 12 13 20 16-13-12-17-31-11-47 4-10 12-18 22-23-6 0-13 0-20 0Z" fill="#080C17" stroke="url(#ring)" stroke-width="2.8" stroke-linejoin="round"/>
  <circle cx="76" cy="25" r="3.3" fill="#FFE9A4"/>
</svg>
