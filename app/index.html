<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a10" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
    <title>Eclipse — Roblox launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-window" aria-label="Eclipse Roblox launcher">
      <div class="stars" aria-hidden="true"></div>
      <header class="titlebar">
        <button class="mobile-menu icon-button" type="button" aria-label="Toggle navigation" data-mobile-menu>
          <span></span><span></span><span></span>
        </button>
        <div class="window-caption">Eclipse</div>
        <div class="titlebar-right">
          <button class="title-action" type="button" data-action="open-status">Roblox launcher</button>
          <span class="titlebar-divider" aria-hidden="true"></span>
          <div class="window-controls" aria-label="Window controls">
            <button type="button" aria-label="Minimize" data-window-control="minimize">−</button>
            <button type="button" aria-label="Maximize" data-window-control="maximize">□</button>
            <button class="close-control" type="button" aria-label="Close" data-window-control="close">×</button>
          </div>
        </div>
      </header>

      <aside class="sidebar" data-sidebar>
        <div class="brand">
          <span class="eclipse-mark" aria-hidden="true"><i></i></span>
          <span class="brand-name">Eclipse</span>
          <span class="preview-badge">Preview</span>
        </div>

        <nav class="navigation" aria-label="Primary navigation">
          <div class="nav-group">
            <p class="nav-label">Explore</p>
            <button class="nav-item active" type="button" data-page="home" aria-current="page">
              <span class="nav-icon icon-home" aria-hidden="true"></span><span>Home</span>
            </button>
            <button class="nav-item" type="button" data-page="discover">
              <span class="nav-icon icon-compass" aria-hidden="true"></span><span>Discover</span>
            </button>
            <button class="nav-item" type="button" data-page="library">
              <span class="nav-icon icon-library" aria-hidden="true"></span><span>Library</span>
            </button>
          </div>
          <div class="nav-group nav-group-bottom">
            <p class="nav-label">Workspace</p>
            <button class="nav-item" type="button" data-page="tools">
              <span class="nav-icon icon-tools" aria-hidden="true"></span><span>Tools</span>
            </button>
            <button class="nav-item" type="button" data-page="settings">
              <span class="nav-icon icon-settings" aria-hidden="true"></span><span>Settings</span>
            </button>
          </div>
        </nav>

        <div class="sidebar-bottom">
          <button class="account-card" type="button" aria-expanded="false" data-account-button>
            <span class="avatar avatar-profile">R</span>
            <span class="account-copy">
              <strong>Roblox account</strong>
              <small><i></i> Official sign-in</small>
            </span>
            <span class="more" aria-hidden="true">···</span>
          </button>
          <div class="account-menu" data-account-menu hidden>
            <p>Roblox handles sign-in securely.</p>
            <button type="button" data-account-action="login">Sign in at Roblox</button>
            <button type="button" data-account-action="download">Install Roblox Player</button>
          </div>
        </div>
      </aside>

      <section class="content" aria-live="polite">
        <div class="content-glow glow-one" aria-hidden="true"></div>
        <div class="content-glow glow-two" aria-hidden="true"></div>
        <div class="page-content" data-page-content tabindex="-1"></div>
      </section>

      <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
