name: Build Windows EXE

on:
  push:
    branches:
      - arena/792ec1a8-eclipse
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  package:
    name: Package Eclipse for Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Run launcher tests
        run: npm run test

      - name: Build portable executable
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath electron-builder.log
          exit $LASTEXITCODE

      - name: Publish packaging diagnostic
        if: steps.package.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('electron-builder.log', 'utf8');
            const text = log.slice(-6000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Eclipse packaging diagnostic',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Electron Builder failed',
                summary: 'The final Electron Builder output is attached below.',
                text
              }
            });

      - name: Stop when packaging failed
        if: steps.package.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Eclipse-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
